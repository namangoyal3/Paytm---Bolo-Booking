<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolo Booking</title>
<meta name="description" content="Voice travel booking in Hindi and English. Paytm Checkin concept demo with sample data.">
<meta name="theme-color" content="#edf2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050f22" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..100,400..700&family=Geist+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i class="ph ph-waveform"></i></span>
      <div><b>Bolo Booking</b><small data-t="tagline"></small></div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="hi" aria-pressed="true">हिं</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="icon-btn" id="voiceToggle" aria-pressed="true"><i class="ph ph-speaker-high"></i></button>
    </div>
  </header>

  <section class="trip" id="trip" hidden aria-live="polite">
    <span class="trip-kicker" data-t="tripKicker"></span>
    <b class="trip-route"><i class="ph ph-map-pin"></i><span id="tripRoute"></span></b>
    <span><i class="ph ph-calendar-blank"></i><span id="tripDate"></span></span>
    <span><i class="ph" id="tripModeIcon"></i><span id="tripMode"></span></span>
    <span id="tripBudgetWrap" hidden><i class="ph ph-wallet"></i><span id="tripBudget"></span></span>
  </section>

  <aside class="trace" aria-label="Agent trace">
    <h2 data-t="traceTitle"></h2>
    <ol id="trace"><li class="empty" data-t="traceEmpty"></li></ol>
  </aside>
  <p class="note" data-t="note"></p>

  <main id="log" aria-live="polite"></main>

  <footer class="dock">
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer" autocomplete="off">
      <input id="text" name="message" maxlength="500" enterkeyhint="send">
      <button type="submit" class="send" id="send" disabled><i class="ph ph-paper-plane-right"></i></button>
      <div class="listen" aria-live="polite"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="heard" id="heard"></span></div>
      <button type="button" class="mic" id="mic" aria-pressed="false"><i class="ph-fill ph-microphone"></i></button>
    </form>
    <p class="hint" id="hint"></p>
  </footer>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
