<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolo Booking</title>
<meta name="description" content="Voice travel booking in Hindi and English. Paytm Checkin concept demo with sample data.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <div class="app">
    <header class="appbar">
      <div class="wordmark" aria-label="Paytm travel"><span class="pay">Pay</span><span class="tm">tm</span><span class="travel">travel</span></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="hi" aria-pressed="true">हिं</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" id="voiceToggle" aria-pressed="true"><i class="ph ph-speaker-high"></i></button>
      </div>
    </header>

    <nav class="tabs" aria-label="Travel mode">
      <button type="button" data-mode="flight"><i class="ph ph-airplane-tilt"></i><span data-t="tabFlight"></span></button>
      <button type="button" data-mode="bus"><i class="ph ph-bus"></i><span data-t="tabBus"></span></button>
      <button type="button" data-mode="train"><i class="ph ph-train"></i><span data-t="tabTrain"></span></button>
      <button type="button" data-mode="hotel"><i class="ph ph-bed"></i><span data-t="tabHotel"></span></button>
    </nav>

    <section class="search" id="trip" hidden aria-live="polite">
      <div class="search-row">
        <div class="field"><small id="fromLabel" data-t="from"></small><b id="tripFrom"></b></div>
        <button type="button" class="swap" id="swap"><i class="ph ph-arrows-left-right"></i></button>
        <div class="field to" id="toField"><small data-t="to"></small><b id="tripTo"></b></div>
      </div>
      <div class="search-meta">
        <span><i class="ph ph-calendar-blank"></i><span id="tripDate"></span></span>
        <span id="tripModeWrap"><i class="ph" id="tripModeIcon"></i><span id="tripMode"></span></span>
        <span id="tripBudgetWrap" hidden><i class="ph ph-wallet"></i><span id="tripBudget"></span></span>
      </div>
    </section>

    <main id="log" aria-live="polite"></main>

    <footer class="dock">
      <div class="chips" id="chips"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="field-in">
          <input id="text" name="message" maxlength="500" enterkeyhint="send">
          <div class="listen" aria-live="polite"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="heard" id="heard"></span></div>
          <button type="submit" class="send" id="send" disabled><i class="ph-fill ph-paper-plane-right"></i></button>
        </div>
        <button type="button" class="mic" id="mic" aria-pressed="false"><i class="ph-fill ph-microphone"></i></button>
      </form>
      <p class="hint" id="hint"></p>
    </footer>
  </div>

  <aside class="side">
    <section class="side-card">
      <h2 data-t="traceTitle"></h2>
      <ol id="trace"><li class="empty" data-t="traceEmpty"></li></ol>
    </section>
    <p class="note" data-t="note"></p>
  </aside>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
